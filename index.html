<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноз погоды</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Заголовок приложения -->
        <header class="header">
            <h1 class="header__title">Прогноз погоды</h1>
        </header>

        <!-- Контейнер с кнопками городов -->
        <div class="cities-buttons" id="citiesButtons">
            <!-- Кнопки городов будут добавлены динамически через JS -->
            
            <!-- Форма поиска (скрыта по умолчанию, показывается при клике на кнопку) -->
            <div class="city-search-form" id="citySearchForm" style="display: none;">
                <form class="search-form" id="searchForm">
                    <div class="search-form__wrapper">
                        <input 
                            type="text" 
                            class="search-form__input" 
                            id="cityInput" 
                            placeholder="Введите название города..."
                            autocomplete="off"
                        >
                        <button type="submit" class="search-form__button">Добавить</button>
                    </div>
                    
                    <!-- Выпадающий список подсказок городов -->
                    <div class="dropdown" id="cityDropdown" style="display: none;">
                        <ul class="dropdown__list" id="dropdownList">
                            <!-- Элементы списка будут добавлены через JS -->
                        </ul>
                    </div>

                    <!-- Блок ошибок под полем ввода -->
                    <div class="error-message" id="searchError" style="display: none;"></div>
                </form>
            </div>
        </div>

        <!-- Лоадер -->
        <div class="loader" id="currentLoader" style="display: none;">
            <div class="loader__spinner"></div>
            <p class="loader__text">Загрузка данных...</p>
        </div>

        <!-- Контейнер для прогноза погоды (сегодня, завтра, послезавтра) -->
        <div class="weather-container" id="weatherContainer">
            <!-- Карточка сегодня -->
            <div class="weather-day" id="weatherToday">
                <!-- Контент будет добавлен через JS -->
            </div>
            
            <!-- Разделительная линия -->
            <div class="weather-divider"></div>
            
            <!-- Карточка завтра -->
            <div class="weather-day" id="weatherTomorrow">
                <!-- Контент будет добавлен через JS -->
            </div>
            
            <!-- Разделительная линия -->
            <div class="weather-divider"></div>
            
            <!-- Карточка послезавтра -->
            <div class="weather-day" id="weatherDayAfter">
                <!-- Контент будет добавлен через JS -->
            </div>
        </div>

        <!-- Блок ошибки -->
        <div class="error-message" id="currentError" style="display: none;"></div>

        <!-- Кнопки действий -->
        <div class="refresh-section">
            <button class="action-button" id="addCityButton">
                Добавить город
            </button>
            <button class="action-button" id="refreshButton">
                <span class="action-button__icon">↻</span>
                Обновить данные
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
